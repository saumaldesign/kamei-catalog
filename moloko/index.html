<script>
/* Файл забираем в фоне и отдаём браузеру готовым куском: атрибут
   download на чужом домене браузеры не слушают и вместо сохранения
   открывают PDF, показывая адрес хранилища. Так человек остаётся на
   нашей странице, а файл просто падает в «Загрузки».

   Второго нажатия не нужно, и кнопка об этом говорит прямо: сперва
   «загрузка начнётся через пару секунд», затем проценты, затем
   «файл сохранён». Без этого молчащая кнопка читается как сломанная. */
document.querySelectorAll('.km-pdf').forEach(function (a) {
  var было = a.textContent;
  a.addEventListener('click', function (e) {
    e.preventDefault();
    if (a.dataset.busy) return;
    a.dataset.busy = '1';
    a.style.opacity = '.75';
    a.textContent = 'Загрузка начнётся через пару секунд';
    fetch(a.href).then(function (r) {
      var всего = +r.headers.get('content-length') || 0;
      if (!r.body || !всего) return r.blob();
      var куски = [], взято = 0, reader = r.body.getReader();
      return (function дальше() {
        return reader.read().then(function (ш) {
          if (ш.done) return new Blob(куски, {type: 'application/pdf'});
          куски.push(ш.value); взято += ш.value.length;
          a.textContent = 'Загрузка… ' + Math.round(взято / всего * 100) + '%';
          return дальше();
        });
      })();
    }).then(function (b) {
      var u = URL.createObjectURL(b), l = document.createElement('a');
      l.href = u; l.download = a.dataset.imya;
      document.body.appendChild(l); l.click(); l.remove();
      setTimeout(function () { URL.revokeObjectURL(u); }, 10000);
      /* надпись не возвращаем: «файл скачан» — это ответ на вопрос
         «получилось ли», и он должен остаться на экране. Нажать ещё
         раз всё равно можно, блокировку снимаем. */
      a.textContent = 'Файл скачан';
      a.style.opacity = ''; delete a.dataset.busy;
    }).catch(function () {
      a.textContent = было; a.style.opacity = ''; delete a.dataset.busy;
      window.open(a.href, '_blank');
    });
  });
});
</script>

*{box-sizing:border-box;margin:0;padding:0}

.km-turn{display:none}
@media (max-width:699px){
 .km-turn{display:block;padding:12px 10px;text-align:center;

  border-bottom:1px solid #152B4F}
 /* считаем от ширины контейнера, а не окна: внутри Тильды блок лежит
    в своей колонке с отступами, и расчёт по 100vw вылез бы за края */
 .km-page{position:relative;width:100%;aspect-ratio:9/16;overflow:hidden}
 .km-page img{position:absolute;top:50%;left:50%;width:177.78%;
  transform:translate(-50%,-50%) rotate(90deg)}
 /* полоса кнопок — такая же страница: лежит боком вместе с каталогом,
    иначе телефон пришлось бы поворачивать обратно ради трёх ссылок */
 .km-low{position:relative;width:100%;aspect-ratio:9/16;
  overflow:hidden;padding:0}
 .km-low-in{position:absolute;top:50%;left:50%;width:177.78%;
  height:56.25%;display:flex;flex-direction:column;justify-content:center;
  padding:0 7%;transform:translate(-50%,-50%) rotate(90deg)}
 /* вполовину короче: на длинной стороне экрана полоса во всю ширину
    выглядит плакатом, а не кнопкой */
 .km-low-in .km-bar{width:50%;margin-left:0;margin-right:auto}
}

<script>
/* Файл забираем в фоне и отдаём браузеру готовым куском: атрибут
   download на чужом домене браузеры не слушают и вместо сохранения
   открывают PDF, показывая адрес хранилища. Так человек остаётся на
   нашей странице, а файл просто падает в «Загрузки». */
document.querySelectorAll('.km-pdf').forEach(function (a) {
  a.addEventListener('click', function (e) {
    e.preventDefault();
    if (a.dataset.busy) return;
    a.dataset.busy = '1';
    var было = a.textContent;
    a.textContent = 'Готовим файл…';
    fetch(a.href).then(function (r) { return r.blob(); }).then(function (b) {
      var u = URL.createObjectURL(b), l = document.createElement('a');
      l.href = u; l.download = a.dataset.imya;
      document.body.appendChild(l); l.click(); l.remove();
      setTimeout(function () { URL.revokeObjectURL(u); }, 10000);
      a.textContent = было; delete a.dataset.busy;
    }).catch(function () {
      a.textContent = было; delete a.dataset.busy;
      window.open(a.href, '_blank');
    });
  });
});
</script>
